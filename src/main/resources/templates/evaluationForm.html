<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Évaluer le prestataire</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom Embedded CSS for Evaluation Page -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
            --card-border-radius: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --text-main: #334155;
            --text-dark: #1a202c;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        h1 {
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            margin-bottom: 1.25rem;
        }

        a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        a:hover {
            color: #0369a1;
            text-decoration: underline;
        }

        /* Incident Summary Card */
        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        /* Form Card Styling */
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            max-width: 600px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.9rem;
            margin-bottom: 0.35rem;
        }

        .form-select, .form-control {
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.95rem;
        }

        .form-select:focus, .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        /* Error Messages */
        .invalid-feedback-custom {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 0.35rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4 mb-5">
    <h1>Évaluer le prestataire</h1>

    <!-- Dynamic Context Summary -->
    <div class="summary-card">
        <p class="mb-2">
            <span class="text-muted fw-semibold">Incident :</span>
            <a th:href="@{/incidents/{id}(id=${incident.id})}" th:text="${incident.description}"></a>
        </p>
        <p class="mb-0">
            <span class="text-muted fw-semibold">Prestataire :</span>
            <strong th:text="${incident.provider.name}"></strong>
        </p>
    </div>

    <!-- Evaluation Form Card -->
    <div class="form-card">
        <form th:action="@{/incidents/{id}/evaluation(id=${incident.id})}" th:object="${newEvaluation}" method="post">

            <!-- Rating Dropdown -->
            <div class="mb-3">
                <label for="rating" class="form-label">Note (sur 5) <span class="text-danger">*</span></label>
                <select id="rating" th:field="*{rating}" class="form-select" th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid'">
                    <option value="">Choisir une note</option>
                    <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="${n} + ' / 5'"></option>
                </select>
                <div th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}" class="invalid-feedback-custom"></div>
            </div>

            <!-- Optional Comment Textarea -->
            <div class="mb-4">
                <label for="comment" class="form-label">Commentaire <span class="text-muted fw-normal">(facultatif)</span></label>
                <textarea id="comment" th:field="*{comment}" rows="4" class="form-control" th:classappend="${#fields.hasErrors('comment')} ? 'is-invalid'" placeholder="Remarques sur l'intervention..."></textarea>
                <div th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="invalid-feedback-custom"></div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    Enregistrer l'évaluation
                </button>
                <a th:href="@{/incidents/{id}(id=${incident.id})}" class="btn btn-outline-secondary">
                    Annuler
                </a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
