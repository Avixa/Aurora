<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom Embedded CSS for Dashboard Page -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
            --card-border-radius: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --text-main: #334155;
            --text-dark: #1a202c;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        h1 {
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            margin-bottom: 1.25rem;
        }

        a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        a:hover {
            color: #0369a1;
            text-decoration: underline;
        }

        /* Nav Quick Links */
        .nav-links-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        /* Synthetic Indicators Card */
        .indicators-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            padding: 1rem 1.25rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .indicators-card strong {
            color: var(--text-dark);
        }

        /* Filters Card */
        .filters-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            padding: 1rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        /* Table Styling */
        .table, table {
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--card-border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .table thead, table thead {
            background-color: #f1f5f9;
        }

        .table thead th, table thead th {
            color: #475569;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.85rem 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .table tbody tr:hover, table tbody tr:hover {
            background-color: #f8fafc !important;
        }

        .table td, table td {
            padding: 0.85rem 1rem;
            font-size: 0.925rem;
            color: var(--text-main);
            border-top: 1px solid #f1f5f5;
        }

        .badge {
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 0.4em 0.75em;
            border-radius: 20px;
        }

        /* Empty State */
        .empty-state {
            background-color: var(--card-bg);
            border: 1px dashed #cbd5e1;
            border-radius: var(--card-border-radius);
            padding: 2.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4 mb-5">
    <h1>Tableau de bord</h1>

    <!-- Quick Navigation Links -->
    <div class="nav-links-container">
        <a th:href="@{/stations}" class="btn btn-outline-secondary btn-sm">Stations et équipements</a>
        <a th:href="@{/incidents}" class="btn btn-outline-secondary btn-sm">Tous les incidents</a>
        <a th:href="@{/incidents/history}" class="btn btn-outline-secondary btn-sm">Historique</a>
    </div>

    <!-- Indicateurs synthétiques -->
    <div class="indicators-card">
        <span>Incidents actifs : <strong th:text="${totalActive}"></strong></span>
        <span th:each="entry : ${counts}">
            · <span th:text="${entry.key.label}"></span> : <strong th:text="${entry.value}"></strong>
        </span>
    </div>

    <!-- Filtres : station et niveau d'attention -->
    <div class="filters-card">
        <form th:action="@{/dashboard}" method="get" class="row g-2 align-items-center">
            <div class="col-auto">
                <select name="stationId" class="form-select form-select-sm">
                    <option value="">Toutes les stations</option>
                    <option th:each="station : ${stations}"
                            th:value="${station.id}" th:text="${station.name}"
                            th:selected="${station.id == selectedStationId}"></option>
                </select>
            </div>
            <div class="col-auto">
                <select name="level" class="form-select form-select-sm">
                    <option value="">Tous les niveaux</option>
                    <option th:each="lvl : ${levels}"
                            th:value="${lvl}" th:text="${lvl.label}"
                            th:selected="${lvl == selectedLevel}"></option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-sm btn-primary">Filtrer</button>
            </div>
        </form>
    </div>

    <!-- Empty State -->
    <p th:if="${#lists.isEmpty(incidents)}" class="empty-state">
        Aucun incident actif pour ces critères.
    </p>

    <!-- Incidents Table -->
    <table th:unless="${#lists.isEmpty(incidents)}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Niveau</th>
            <th>Station</th>
            <th>Équipement</th>
            <th>Description</th>
            <th>Ouvert depuis</th>
            <th>Prestataire</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${incidents}">
            <td th:switch="${row.level().name()}">
                <span th:case="'GREEN'" class="badge bg-success" th:text="${row.level().label}"></span>
                <span th:case="'ORANGE'" class="badge bg-warning text-dark" th:text="${row.level().label}"></span>
                <span th:case="'RED'" class="badge bg-danger" th:text="${row.level().label}"></span>
                <span th:case="'ASSIGNED'" class="badge bg-secondary" th:text="${row.level().label}"></span>
            </td>
            <td th:text="${row.incident().equipment.station.name}"></td>
            <td>
                <a th:href="@{/equipments/{id}(id=${row.incident().equipment.id})}"
                   th:text="${row.incident().equipment.reference} + ' – ' + ${row.incident().equipment.label}"></a>
            </td>
            <td th:text="${row.incident().description}"></td>
            <td th:text="${row.hoursOpen()} + ' h'"></td>
            <td th:text="${row.incident().provider?.name} ?: '—'"></td>
            <td>
                <a th:href="@{/incidents/{id}(id=${row.incident().id})}" class="btn btn-sm btn-outline-primary">Détail</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
