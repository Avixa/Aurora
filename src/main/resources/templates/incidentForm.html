<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Report an incident</title>
  </head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
  <h1>Report an incident</h1>
  <p>Equipment:
    <strong th:text="${equipment.reference} + ' - ' + ${equipment.label}"></strong>
  </p>

  <form th:action="@{/equipments/{id}/incidents(id=${equipment.id})}"
        th:object="${newIncident}" method="POST">

    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger w-50">
      The form contains errors, please correct them.
    </div>

    <label class="form-label" for="description">Description</label>
    <textarea th:field="*{description}" rows="4"
              class="form-control mb-1 w-50"
              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
    <div class="text-danger mb-3" th:if="${#fields.hasErrors('description')}"
         th:errors="*{description}"></div>

    <label class="form-label" for="openingDate">Opening date</label>
    <input type="datetime-local" th:field="*{openingDate}"
           class="form-control mb-1 w-50"
           th:classappend="${#fields.hasErrors('openingDate')} ? 'is-invalid'">
    <div class="text-danger mb-3" th:if="${#fields.hasErrors('openingDate')}"
         th:errors="*{openingDate}"></div>

    <button type="submit" class="btn btn-primary">Report</button>
    <a th:href="@{/equipments/{id}(id=${equipment.id})}" class="btn btn-link">Cancel</a>
  </form>
</div>
</body>
</html>
