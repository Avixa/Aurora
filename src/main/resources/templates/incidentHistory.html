<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des incidents résolus</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom Embedded CSS aligned with Design System -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
            --card-border-radius: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --text-main: #334155;
            --text-dark: #1a202c;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        h1 {
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4 mb-5">
    <h1>Historique des incidents résolus</h1>
    <p class="subtitle">Du plus récemment résolu au plus ancien.</p>

    <!-- Incident Table Fragment with showEquipment = true -->
    <div th:replace="~{fragments/incidentTable :: incidentTable(${incidents}, true)}"></div>
</main>

</body>
</html>
