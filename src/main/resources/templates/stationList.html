<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stations</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom Embedded CSS for Stations Page -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
            --card-border-radius: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --text-main: #334155;
            --text-dark: #1a202c;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        h1 {
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            margin-bottom: 1.25rem;
        }

        a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        a:hover {
            color: #0369a1;
            text-decoration: underline;
        }

        /* Map Card Container */
        .map-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            box-shadow: var(--shadow-sm);
            padding: 0.75rem;
            margin-bottom: 2rem;
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: calc(var(--card-border-radius) - 2px);
            z-index: 1;
        }

        /* Table Styling */
        .table, table {
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--card-border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .table thead, table thead {
            background-color: #f1f5f9;
        }

        .table thead th, table thead th {
            color: #475569;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.85rem 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .table tbody tr:hover, table tbody tr:hover {
            background-color: #f8fafc !important;
        }

        .table td, table td {
            padding: 0.85rem 1rem;
            font-size: 0.925rem;
            color: var(--text-main);
            border-top: 1px solid #f1f5f5;
        }

        /* Empty State inside table row */
        .empty-state-cell {
            background-color: var(--card-bg);
            text-align: center;
            color: var(--text-muted);
            padding: 2.5rem !important;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4 mb-5">
    <h1>Stations</h1>

    <!-- Interactive Map Card -->
    <div class="map-card">
        <div id="map"></div>
    </div>

    <!-- Stations Table -->
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Nom</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${stations}">
            <td class="fw-semibold" th:text="${s.name}"></td>
            <td class="text-end">
                <a th:href="@{/stations/{id}/equipments(id=${s.id})}" class="btn btn-sm btn-outline-primary">
                    Voir les équipements
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(stations)}">
            <td colspan="2" class="empty-state-cell">Aucune station trouvée.</td>
        </tr>
        </tbody>
    </table>
</main>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Embedded Inline Script using Thymeleaf Inlining -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        // 1. Serialize Thymeleaf stations list directly into JavaScript
        /*[# th:if="${not #lists.isEmpty(stations)}"]*/
        const stations = /*[[${stations}]]*/ [];
        /*[/]*/
        /*[# th:unless="${not #lists.isEmpty(stations)}"]*/
        const stations = [];
        /*[/]*/

        // 2. Initialize Leaflet map with France fallback center
        const map = L.map('map').setView([46.603354, 1.888334], 6);

        // 3. Load OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const markers = [];

        // 4. Loop through stations and plot valid markers
        stations.forEach(s => {
            if (s.latitude !== null && s.longitude !== null) {
                const marker = L.marker([s.latitude, s.longitude]).addTo(map);

                // Add interactive popup linking to equipment view
                marker.bindPopup(`
                    <div style="font-family: sans-serif;">
                        <strong style="font-size: 1rem; color: #1a202c;">${s.name}</strong><br>
                        <a href="/stations/${s.id}/equipments" style="display: inline-block; margin-top: 6px; font-size: 0.85rem; color: #0284c7;">
                            Voir les équipements &rarr;
                        </a>
                    </div>
                `);

                markers.push(marker);
            }
        });

        // 5. Automatically adjust map zoom/center to fit all visible station markers
        if (markers.length > 0) {
            const group = new L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.15));
        }
    });
</script>

</body>
</html>
