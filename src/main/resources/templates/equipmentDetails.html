<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Équipement - Details</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom Embedded CSS for Equipment Page -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
            --card-border-radius: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --text-main: #334155;
            --text-dark: #1a202c;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        h1 {
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        h2 {
            font-weight: 600;
            font-size: 1.35rem;
            color: var(--text-dark);
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        a:hover {
            color: #0369a1;
            text-decoration: underline;
        }

        /* Equipment Details Key-Value Card */
        dl {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            display: grid;
            grid-template-columns: minmax(140px, 200px) 1fr;
            gap: 0.85rem 1.5rem;
            align-items: baseline;
            margin-bottom: 1.5rem;
        }

        dt {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        dd {
            margin-bottom: 0;
            color: var(--text-dark);
            font-weight: 500;
        }

        /* Table Styling inside Fragments */
        .table, table {
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--card-border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .table thead, table thead {
            background-color: #f1f5f9;
        }

        .table thead th, table thead th {
            color: #475569;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.85rem 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .table tbody tr:hover, table tbody tr:hover {
            background-color: #f8fafc !important;
        }

        .table td, table td {
            padding: 0.85rem 1rem;
            font-size: 0.925rem;
            color: var(--text-main);
            border-top: 1px solid #f1f5f5;
        }

        .badge {
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 0.4em 0.75em;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0" th:text="${equipment.reference} + ' - ' + ${equipment.label}"></h1>

        <a th:if="${session.loggedUser.can('DECLARE_INCIDENT')}"
           th:href="@{/equipments/{id}/incidents/new(id=${equipment.id})}"
           class="btn btn-primary">
            + Déclarer un incident
        </a>
    </div>

    <!-- Equipment Details Card -->
    <dl>
        <dt>Type</dt>
        <dd th:text="${equipment.type.label}"></dd>

        <dt>Station</dt>
        <dd>
            <a th:href="@{/stations/{id}/equipments(id=${equipment.station.id})}"
               th:text="${equipment.station.name}"></a>
        </dd>

        <dt>État de fonctionnement</dt>
        <dd th:text="${equipment.operatingState}"></dd>

        <dt>Description</dt>
        <dd th:text="${equipment.description}"></dd>
    </dl>

    <!-- Ongoing Incidents -->
    <h2>Incidents en cours</h2>
    <div th:replace="~{fragments/incidentTable :: incidentTable(${ongoingIncidents}, false)}"></div>

    <!-- Past Incidents -->
    <h2>Historique des incidents</h2>
    <div th:replace="~{fragments/incidentTable :: incidentTable(${pastIncidents}, false)}"></div>

</main>

</body>
</html>
