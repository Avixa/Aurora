<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Equipment</title></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<h1 th:text="${equipment.reference} + ' - ' + ${equipment.label}"></h1>
<p>Type: <span th:text="${equipment.type.label}"></span></p>
<p>Station: <a th:href="@{/stations/{id}/equipments(id=${equipment.station.id})}"
               th:text="${equipment.station.name}"></a></p>
<p>State: <span th:text="${equipment.operatingState}"></span></p>
<p>Description: <span th:text="${equipment.description}"></span></p>

<p><a th:href="@{/equipments/{id}/incidents/new(id=${equipment.id})}">Report an incident</a></p>

<h2>Ongoing incidents</h2>
<div th:replace="~{fragments/incidentTable :: incidentTable(${ongoingIncidents}, false)}"></div>

<h2>Past incidents</h2>
<div th:replace="~{fragments/incidentTable :: incidentTable(${pastIncidents}, false)}"></div>

</body>
</html>
