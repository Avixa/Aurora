<div th:fragment="header" xmlns:th="http://www.thymeleaf.org">
    <!-- Inline CSS for Header Fragment -->
    <style th:inline="css">
        .app-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 0.75rem 0;
            margin-bottom: 1.5rem;
        }

        .user-badge {
            font-weight: 500;
            color: #334155;
            font-size: 0.925rem;
        }

        .user-role {
            color: #64748b;
            font-size: 0.85rem;
        }

        .btn-logout {
            color: #dc2626;
            border-color: #fecaca;
            background-color: #fef2f2;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            color: #ffffff;
            background-color: #dc2626;
            border-color: #dc2626;
        }
    </style>

    <link rel="stylesheet" th:href="@{/css/aurora.css}">

    <script>
        // reapply the saved theme on every page, before the content is drawn
        if (localStorage.getItem('aurora-theme') === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
        }

        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            const apply = () => document.documentElement.setAttribute('data-bs-theme', next);
            // smooth cross-fade when the browser supports it
            if (document.startViewTransition) {
                document.startViewTransition(apply);
            } else {
                apply();
            }
            localStorage.setItem('aurora-theme', next);
        }
    </script>

    <header th:if="${session.loggedUser != null}" class="app-header">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- App Brand / Navigation Home Link -->
            <a th:href="@{/dashboard}" class="fw-bold text-dark text-decoration-none fs-5">
                🚆 Aurora
            </a>

            <!-- User Info & Logout -->
            <div class="d-flex align-items-center gap-3">
                <span class="user-badge">
                    Bonjour <strong th:text="${session.loggedUser.firstName()}"></strong>
                    <span class="user-role" th:text="'(' + ${session.loggedUser.profile().label} + ')'"></span>
                </span>

                <button type="button" class="btn btn-sm btn-theme" onclick="toggleTheme()"
                        title="Changer de thème" aria-label="Changer de thème">
                    <span class="icon-to-dark">🌙</span>
                    <span class="icon-to-light">☀️</span>
                </button>

                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-logout">
                        Déconnexion
                    </button>
                </form>
            </div>
        </div>
    </header>
</div>
