<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Équipements - Stations</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom Embedded CSS aligned with Design System -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
            --card-border-radius: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --text-main: #334155;
            --text-dark: #1a202c;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        h1 {
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            margin-bottom: 1.25rem;
        }

        a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        a:hover {
            color: #0369a1;
            text-decoration: underline;
        }

        /* Table Styling */
        .table, table {
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--card-border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .table thead, table thead {
            background-color: #f1f5f9;
        }

        .table thead th, table thead th {
            color: #475569;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.85rem 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .table tbody tr:hover, table tbody tr:hover {
            background-color: #f8fafc !important;
        }

        .table td, table td {
            padding: 0.85rem 1rem;
            font-size: 0.925rem;
            color: var(--text-main);
            border-top: 1px solid #f1f5f5;
        }

        .badge {
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 0.4em 0.75em;
            border-radius: 20px;
        }

        .empty-state-cell {
            background-color: var(--card-bg);
            text-align: center;
            color: var(--text-muted);
            padding: 2.5rem !important;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-4 mb-5">
    <h1>Équipements de la station : <span th:text="${station.name}"></span></h1>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Référence</th>
                <th>Libellé</th>
                <th>Type</th>
                <th>État de fonctionnement</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${equipments}">
                <td>
                    <a th:href="@{/equipments/{id}(id=${e.id})}" th:text="${e.reference}" class="fw-semibold"></a>
                </td>
                <td th:text="${e.label}"></td>
                <td th:text="${e.type.label}"></td>
                <td>
                    <span class="badge bg-secondary" th:text="${e.operatingState}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(equipments)}">
                <td colspan="4" class="empty-state-cell">Aucun équipement trouvé pour cette station.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
