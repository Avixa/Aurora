spring.application.name=TpFilRouge

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
server.forward-headers-strategy=framework
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.mvc.hiddenmethod.filter.enabled=true

server.web.error.include-message=always

logging.level.root=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
logging.level.org.springframework.web.servlet.view=INFO
logging.level.org.thymeleaf=INFO

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

spring.datasource.hikari.maximum-pool-size=5
